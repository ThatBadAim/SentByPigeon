name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Find Gradle wrapper, make executable, and run Unit Tests
        run: |
          # Locate gradlew anywhere in the repository (search depth 4)
          WRAPPER=$(find . -maxdepth 4 -type f -name gradlew | head -n1)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found. Please commit the Gradle wrapper files (gradlew, gradlew.bat, gradle/wrapper/*) to the repo." 
            echo "Attempting to run system-installed gradle as a fallback..."
            if command -v gradle >/dev/null 2>&1; then
              gradle test --stacktrace
            else
              echo "No gradle available on runner. Failing the job.";
              exit 1
            fi
          else
            chmod +x "$WRAPPER"
            WRAPPER_DIR=$(dirname "$WRAPPER")
            echo "Using gradlew in $WRAPPER_DIR"
            cd "$WRAPPER_DIR"
            ./gradlew test --stacktrace
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Instrumented UI & DB Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            # find gradlew and run connectedCheck from its directory
            WRAPPER=$(find . -maxdepth 4 -type f -name gradlew | head -n1)
            if [ -z "$WRAPPER" ]; then
              echo "gradlew not found. Cannot run connected tests. Please commit the Gradle wrapper files.";
              exit 1
            fi
            chmod +x "$WRAPPER"
            WRAPPER_DIR=$(dirname "$WRAPPER")
            cd "$WRAPPER_DIR"
            ./gradlew connectedCheck --stacktrace
